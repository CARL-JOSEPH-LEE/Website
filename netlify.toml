# Pushes to GitHub main build and publish dist/ to 8sora8.com automatically.
# Generated _headers also keeps a standalone dist/ deployment self-contained.
[build]
  command = "node tools/build.cjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Install the pinned esbuild build dependency; skip Playwright on Netlify.
  NODE_ENV = "production"
